name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Full verification
        run: make verify

      - name: Package app
        run: make package

      - name: Upload verified app
        uses: actions/upload-artifact@v4
        with:
          name: HangulFix-macOS
          path: |
            dist/HangulFix-macOS.zip
            dist/HangulFix-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14
