name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Validate E2E fixture generator
        run: |
          python3 -m py_compile scripts/e2e_fixture.py
          python3 scripts/e2e_fixture.py create "$RUNNER_TEMP/HangulFix-E2E-Test"

      - name: Final release verification
        run: make release-check

      - name: Upload verified v1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HangulFix-macOS
          path: |
            dist/HangulFix-*-macOS.zip
            dist/HangulFix-*-macOS.zip.sha256
            dist/HangulFix-*-macOS.dmg
            dist/HangulFix-*-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 14
