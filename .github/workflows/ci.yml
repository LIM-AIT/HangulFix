name: macOS CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Release build
        run: swift build -c release

      - name: Build app bundle
        run: make app
